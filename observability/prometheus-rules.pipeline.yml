groups:
  - name: pipeline_e2e_recording
    interval: 30s
    rules:
      - record: pipeline_e2e_latency_seconds:p50
        expr: histogram_quantile(0.50, sum(rate(signal_end_to_end_latency_seconds_bucket[5m])) by (le))
      - record: pipeline_e2e_latency_seconds:p95
        expr: histogram_quantile(0.95, sum(rate(signal_end_to_end_latency_seconds_bucket[5m])) by (le))
      - record: pipeline_e2e_success_ratio:5m
        expr: |
          clamp_max(
            sum(rate(decision_packet_out_total{status="success"}[5m])) /
            clamp_min(sum(rate(narrative_clue_out_total{status="success"}[5m])), 0.000001),
            1
          )
      - record: pipeline_e2e_error_ratio:5m
        expr: |
          clamp_max(
            sum(rate(strong_agent_requests_total{status="error"}[5m])) /
            clamp_min(sum(rate(strong_agent_requests_total[5m])), 0.000001),
            1
          )
      - record: local_ml_filter_pass_ratio:5m
        expr: |
          clamp_max(
            sum(rate(local_ml_filter_total{decision="pass"}[5m])) /
            clamp_min(sum(rate(local_ml_filter_total[5m])), 0.000001),
            1
          )
      - record: pipeline_freshness_seconds
        expr: time() - sink_consumer_last_successful_write_unixtime

  - name: service_alerts
    interval: 30s
    rules:
      - alert: PipelineE2ELatencyHigh
        expr: pipeline_e2e_latency_seconds:p95 > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline P95 latency is high"
          description: "P95 end-to-end latency has been above 15 seconds for 10 minutes."

      - alert: StrongAgentErrorRateHigh
        expr: pipeline_e2e_error_ratio:5m > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Strong agent error ratio is high"
          description: "Strong agent request error ratio has been above 5% for 10 minutes."

      - alert: SinkConsumerNoRecentWrite
        expr: pipeline_freshness_seconds > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sink consumer appears stalled"
          description: "No successful sink DB write in the last 2 minutes."

      - alert: KafkaLagHighAgentPipeline
        expr: sum(kafka_consumergroup_lag{topic=~"narrative_clue|event_packet|decision_packet"}) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agent pipeline consumer lag is high"
          description: "Consumer lag on narrative/event/decision topics exceeded 10k for 10 minutes."
