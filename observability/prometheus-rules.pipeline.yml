groups:
  - name: pipeline_e2e_recording
    interval: 30s
    rules:
      - record: pipeline_e2e_latency_seconds:p50
        expr: histogram_quantile(0.50, sum(rate(signal_end_to_end_latency_seconds_bucket[5m])) by (le))
      - record: pipeline_e2e_latency_seconds:p95
        expr: histogram_quantile(0.95, sum(rate(signal_end_to_end_latency_seconds_bucket[5m])) by (le))
      - record: pipeline_e2e_success_ratio:5m
        expr: |
          clamp_max(
            sum(rate(signals_final_total[5m])) /
            clamp_min(sum(rate(signals_candidate_total[5m])), 0.000001),
            1
          )
      - record: pipeline_e2e_error_ratio:5m
        expr: |
          clamp_max(
            sum(rate(llm_requests_total{status="error"}[5m])) /
            clamp_min(sum(rate(llm_requests_total[5m])), 0.000001),
            1
          )
      - record: pipeline_trace_completeness_ratio:5m
        expr: |
          clamp_max(
            sum(rate(signals_final_total[5m])) /
            clamp_min(sum(rate(bluesky_ingestor_raw_publish_success_total[5m])), 0.000001),
            1
          )
      - record: pipeline_freshness_seconds
        expr: time() - sink_consumer_last_successful_write_unixtime

  - name: service_alerts
    interval: 30s
    rules:
      - alert: PipelineE2ELatencyHigh
        expr: pipeline_e2e_latency_seconds:p95 > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline P95 latency is high"
          description: "P95 end-to-end latency has been above 15 seconds for 10 minutes."

      - alert: PipelineTraceCompletenessLow
        expr: pipeline_trace_completeness_ratio:5m < 0.7
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline trace completeness is low"
          description: "Final output compared to ingest success is below expected baseline."

      - alert: LLMErrorRateHigh
        expr: pipeline_e2e_error_ratio:5m > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "LLM error ratio is high"
          description: "LLM request error ratio has been above 5% for 10 minutes."

      - alert: SinkConsumerNoRecentWrite
        expr: pipeline_freshness_seconds > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sink consumer appears stalled"
          description: "No successful sink DB write in the last 2 minutes."

      - alert: KafkaLagHighCandidateFinal
        expr: sum(kafka_consumergroup_lag{topic=~"strategy_signal_candidate|strategy_signal_final"}) > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Candidate/final consumer lag is high"
          description: "Consumer lag on candidate/final topics exceeded 10k for 10 minutes."
