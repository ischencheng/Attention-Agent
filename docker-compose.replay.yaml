services:
  replay-source:
    profiles: [legacy-replay]
    build:
      context: ./validation/replay-source
      dockerfile: Dockerfile
    container_name: replay-source
    hostname: replay-source
    networks: [backend]
    command:
      - "python"
      - "/app/jetstream_replay_server.py"
      - "--dataset"
      - "/data/golden_samples.json"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9001"
      - "--path"
      - "/subscribe"
      - "--messages-per-second"
      - "1"
      - "--max-loops"
      - "1"
      # - "--loop-forever"
    volumes:
      - ./validation/golden-dataset/golden_samples.json:/data/golden_samples.json:ro
    ports:
      - "9001:9001"
    restart: "no"

  bluesky-ingestor:
    profiles: [legacy-replay]
    build:
      context: ./bluesky-demo
      dockerfile: Dockerfile
    container_name: bluesky-ingestor
    networks: [backend]
    environment:
      PYTHONUNBUFFERED: "1"
      OTEL_SERVICE_NAME: bluesky-ingestor
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command:
      - "python"
      - "bluesky_ingestor.py"
      - "--bootstrap"
      - "kafka1:19092,kafka2:19092,kafka3:19092"
      - "--topic"
      - "source_raw"
      - "--jetstream-url"
      - "ws://replay-source:9001/subscribe"
      - "--metrics-port"
      - "8020"
      - "--max-produce-retries"
      - "5"
      - "--produce-retry-backoff-seconds"
      - "0.5"
    ports:
      - "8020:8020"
    restart: "no"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      otel-collector:
        condition: service_started
      replay-source:
        condition: service_started
