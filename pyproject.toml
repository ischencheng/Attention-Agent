[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-financial-env"
version = "0.1.0"
description = "A financial research RL environment with time-gated evidence and delayed forecast rewards"
readme = "environments/financial_decision/README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
gym = ["gymnasium==1.4.0"]

[project.scripts]
attention-financial-env = "environments.financial_decision.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["environments.financial_decision", "environments.attention_judgment"]
namespaces = true

[tool.setuptools.package-data]
"environments.financial_decision" = ["fixtures/*.json", "README.md"]
"environments.attention_judgment" = ["scope.json"]
