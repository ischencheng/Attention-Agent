[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-financial-env"
version = "0.2.0"
description = "Topic-led research and paper portfolio RL environments with point-in-time evidence"
readme = "environments/research_portfolio/README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
gym = ["gymnasium==1.4.0"]
archive = ["exchange-calendars==4.13.2"]

[project.scripts]
attention-financial-env = "environments.financial_decision.cli:main"
attention-research-env = "environments.research_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["environments.financial_decision", "environments.attention_judgment", "environments.research_portfolio", "agent"]
namespaces = true

[tool.setuptools.package-data]
"environments.financial_decision" = ["fixtures/*.json", "README.md"]
"environments.attention_judgment" = ["scope.json"]
"environments.research_portfolio" = ["fixtures/*.json", "README.md"]
