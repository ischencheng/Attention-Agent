global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/pipeline.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          env: local_lab
          component: monitoring

  - job_name: kafka_exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          env: local_lab
          component: kafka_broker

  - job_name: bluesky_ingestor
    static_configs:
      - targets: ["bluesky-ingestor:8020"]
        labels:
          env: local_lab
          component: bluesky_ingestor

  - job_name: fast_agent
    static_configs:
      - targets: ["fast-agent:8030"]
        labels:
          env: local_lab
          component: fast_agent

  - job_name: local_ml_filter
    static_configs:
      - targets: ["local-ml-filter:8031"]
        labels:
          env: local_lab
          component: local_ml_filter

  - job_name: mid_agent
    static_configs:
      - targets: ["mid-agent:8032"]
        labels:
          env: local_lab
          component: mid_agent

  - job_name: embed_worker
    static_configs:
      - targets: ["embed-worker:8034"]
        labels:
          env: local_lab
          component: embed_worker

  - job_name: strong_agent
    static_configs:
      - targets: ["strong-agent:8033"]
        labels:
          env: local_lab
          component: strong_agent

  - job_name: sink_consumer
    static_configs:
      - targets: ["sink-consumer:8040"]
        labels:
          env: local_lab
          component: sink_consumer

  - job_name: backend_fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-fastapi:8000"]
        labels:
          env: local_lab
          component: backend_fastapi

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: local_lab
          component: postgres

  - job_name: flink_jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9249"]
        labels:
          env: local_lab
          component: flink_jobmanager

  - job_name: flink_taskmanager
    static_configs:
      - targets: ["flink-taskmanager:9250"]
        labels:
          env: local_lab
          component: flink_taskmanager

  - job_name: otel_collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          env: local_lab
          component: otel_collector
