services:
  replay-source:
    build:
      context: ./validation/replay-source
      dockerfile: Dockerfile
    container_name: replay-source
    hostname: replay-source
    networks: [backend]
    command:
      - "python"
      - "/app/jetstream_replay_server.py"
      - "--dataset"
      - "/data/golden_samples.json"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "9001"
      - "--path"
      - "/subscribe"
      - "--messages-per-second"
      - "1"
      - "--max-loops"
      - "1"
      # - "--loop-forever"
    volumes:
      - ./validation/golden-dataset/golden_samples.json:/data/golden_samples.json:ro
    ports:
      - "9001:9001"
    restart: "no"

  bluesky-ingestor:
    command:
      - "python"
      - "bluesky_ingestor.py"
      - "--bootstrap"
      - "kafka1:19092,kafka2:19092,kafka3:19092"
      - "--topic"
      - "source_raw"
      - "--jetstream-url"
      - "ws://replay-source:9001/subscribe"
      - "--metrics-port"
      - "8020"
      - "--max-produce-retries"
      - "5"
      - "--produce-retry-backoff-seconds"
      - "0.5"
    depends_on:
      replay-source:
        condition: service_started
